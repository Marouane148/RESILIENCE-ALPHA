limit_req_zone $binary_remote_addr zone=payment_edge:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://localhost:3000; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com" always;

  location / {
    limit_req zone=payment_edge burst=40 nodelay;
    if ($query_string ~* "(union|select|drop|insert|<script|\.\./)") { return 403; }
    try_files $uri $uri/ /index.html;
  }
}
