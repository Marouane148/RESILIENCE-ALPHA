---
- name: Remediate the Resilience-Alpha payment platform
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    docker_host: "{{ lookup('env', 'DOCKER_HOST') | default('unix:///var/run/docker.sock', true) }}"
    # Périmètre strictement limité : la base d'abord, puis l'API qui en dépend.
    repair_order:
      - resilience-postgres
      - resilience-payment-api
    # Passage court (24 s maximum par attente) : l'état est ré-évalué au passage suivant plutôt que de bloquer le verrou.
    recovery_retries: 12
    recovery_delay_seconds: 2

  tasks:
    - name: Repair the platform containers in dependency order
      ansible.builtin.include_tasks: repair_container.yml
      loop: "{{ repair_order }}"
      loop_control:
        loop_var: repair_target

    - name: Verify the payment API answers with a working database
      ansible.builtin.uri:
        url: http://payment-api:3000/health
        return_content: true
        timeout: 3
      register: payment_health
      until: payment_health.status | default(0) == 200 and payment_health.json.database | default('') == 'ok'
      # N'attend le retour du service que si ce passage a réparé quelque chose ; sinon un seul essai (l'état est ré-évalué au passage suivant).
      retries: "{{ 6 if any_repair | default(false) else 1 }}"
      delay: "{{ recovery_delay_seconds }}"

    - name: Confirm the business service is available again
      ansible.builtin.debug:
        msg: "Service de paiement opérationnel : {{ payment_health.json }}"
